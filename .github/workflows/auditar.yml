name: Auditar Licitaciones Abiertas (PLACSP, TED y PSCP)

on:
  schedule:
    - cron: '30 0 */14 * *'  # Cada 14 días a las 00:30 UTC
  workflow_dispatch:        # Permite ejecución manual

jobs:
  auditar_todas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml beautifulsoup4 sentence-transformers supabase sodapy

      - name: Ejecutar auditoría PLACSP
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python auditar_abiertas_atom.py

      - name: Ejecutar auditoría TED
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python auditar_abiertas_ted.py

      - name: Ejecutar auditoría PSCP Catalunya
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python auditar_abiertas_pscp.py

      - name: Ejecutar auditoría Euskadi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python auditar_abiertas_euskadi.py
      - name: Ejecutar auditoría Madrid
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python auditar_abiertas_madrid.py
      - name: Ejecutar auditoría La Rioja
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python auditar_abiertas_larioja.py
      - name: Ejecutar auditoría Navarra
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python auditar_abiertas_navarra.py
      - name: Ejecutar auditoría Galicia
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python auditar_abiertas_galicia.py
      - name: Ejecutar auditoría Andalucia
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python auditar_abiertas_andalucia.py
