name: Auditar Licitaciones Abiertas (PLACSP y TED)

on:
  schedule:
    - cron: '30 0 * * *'  # Todos los días a las 00:30 UTC
  workflow_dispatch:      # Permite ejecución manual

jobs:
  auditar_todas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml sentence-transformers supabase

      - name: Ejecutar auditoría PLACSP
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python auditar_abiertas.py

      - name: Ejecutar auditoría TED
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python auditar_abiertas_ted.py
