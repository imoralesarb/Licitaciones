name: Sincronizar Licitaciones TED

on:
  schedule:
    # 4:00 AM en hora canaria (04:00 UTC)
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  sincronizar-ted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser supabase sentence-transformers lxml requests

      - name: Ejecutar script TED
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python sincronizar_TED.py
